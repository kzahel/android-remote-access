name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      hosted_origin:
        description: Optional HTTPS development relay origin for hosted acceptance
        required: false
        type: string
      control_acceptance:
        description: Also run owned-emulator viewing, video, gestures and synthetic unlock
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26'
          cache: false
      - name: Scan complete history with reviewed public-fixture exceptions
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" git . --redact --log-opts=--all
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: python3 -m unittest discover -s scripts -p 'test_android_publishing.py'
      - run: pnpm build:android
      - run: npm --prefix spike ci --ignore-scripts
      - run: pnpm test:spike
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:viewer-layout
      - run: pnpm test:viewer-phones
  browser-android-interop:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/emulator-smoke.yml

  hosted-pairing-acceptance:
    if: github.event_name == 'workflow_dispatch' && inputs.hosted_origin != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0' 'system-images;android-35;google_apis;x86_64' 'emulator'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: Build APKs pinned to the acceptance service
        run: ./android/gradlew -p android :app:assembleDebug :app:assembleDebugAndroidTest "-PsharingWebsite=$HOSTED_ORIGIN"
        env:
          HOSTED_ORIGIN: ${{ inputs.hosted_origin }}
      - run: pnpm test:hosted
        env:
          HOSTED_ORIGIN: ${{ inputs.hosted_origin }}
          # The runner-generated debug key is not a public domain-associated signer.
          HOSTED_VERIFY_APP_LINKS: '0'
      - name: Encrypted hosted control acceptance
        if: inputs.control_acceptance
        run: pnpm exec tsx scripts/hosted-acceptance.ts --control
        env:
          HOSTED_ORIGIN: ${{ inputs.hosted_origin }}
          # The runner-generated debug key is not a public domain-associated signer.
          HOSTED_VERIFY_APP_LINKS: '0'
          HOSTED_TOUCH: '1'
          HOSTED_UNLOCK: '1'
          HOSTED_VIDEO: '1'
          HOSTED_ROTATION: '1'
