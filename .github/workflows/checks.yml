name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      hosted_origin:
        description: Optional HTTPS development relay origin for hosted acceptance
        required: false
        type: string
      control_acceptance:
        description: Also run owned-emulator viewing, video, gestures and synthetic unlock
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build:android
      - run: npm --prefix spike ci --ignore-scripts
      - run: pnpm test:spike
  browser-android-interop:
    # Explicit full harness: owns and reaps its emulator, never adopts a device.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0' 'system-images;android-35;google_apis;x86_64' 'emulator'
      - name: Enable KVM for the owned emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm build:android
      - run: pnpm test:interop

  hosted-pairing-acceptance:
    if: github.event_name == 'workflow_dispatch' && inputs.hosted_origin != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0' 'system-images;android-35;google_apis;x86_64' 'emulator'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm build:android
      - run: pnpm test:hosted
        env:
          HOSTED_ORIGIN: ${{ inputs.hosted_origin }}
      - name: Encrypted hosted control acceptance
        if: inputs.control_acceptance
        run: pnpm exec tsx scripts/hosted-acceptance.ts --control
        env:
          HOSTED_ORIGIN: ${{ inputs.hosted_origin }}
          HOSTED_TOUCH: '1'
          HOSTED_UNLOCK: '1'
          HOSTED_VIDEO: '1'
          HOSTED_ROTATION: '1'
