name: Android emulator smoke
on:
  workflow_call:
    inputs:
      hosted_origin:
        description: Optional development relay for release pairing, FCM and control acceptance
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      hosted_origin:
        description: Optional HTTPS development relay origin for full release acceptance
        required: false
        default: ''
        type: string
  schedule:
    - cron: '23 3 * * *'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0' 'system-images;android-35;google_apis;x86_64' 'emulator'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Enable KVM for owned emulators
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm build:android
      # Each harness refuses occupied selectors and owns/reaps its emulator.
      - run: pnpm test:interop
      - run: pnpm test:mobile-smoke
      - name: Hosted pairing and process-absent FCM wake
        if: inputs.hosted_origin != ''
        run: pnpm test:hosted
        env:
          HOSTED_ORIGIN: ${{ inputs.hosted_origin }}
          # The runner-generated debug key is not a public domain-associated signer.
          HOSTED_VERIFY_APP_LINKS: '0'
          HOSTED_FCM: '1'
      - name: Hosted encrypted control release acceptance
        if: inputs.hosted_origin != ''
        run: pnpm exec tsx scripts/hosted-acceptance.ts --control
        env:
          HOSTED_ORIGIN: ${{ inputs.hosted_origin }}
          # The runner-generated debug key is not a public domain-associated signer.
          HOSTED_VERIFY_APP_LINKS: '0'
          HOSTED_TOUCH: '1'
          HOSTED_UNLOCK: '1'
          HOSTED_VIDEO: '1'
          HOSTED_ROTATION: '1'
      # Logs, QR material and app data stay private; do not upload .local/.
