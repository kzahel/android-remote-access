<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Remote access · Add a phone</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/pair.js"></script>
  </head>
  <body class="pairing">
    <main class="pair-card">
      <div class="wordmark"><span class="mark">↗</span><span>Remote access</span></div>
      <h1 id="pair-title">Checking this browser…</h1>
      <p id="pair-lead"></p>
      <div id="pair-code" class="pair-code" hidden>
        <img id="pair-qr" alt="Pairing code for your phone" />
        <ol>
          <li>On the phone, open <strong>Remote access</strong>.</li>
          <li>Tap <strong>Pair with a browser</strong> and scan this code.</li>
          <li>Check the name, then tap <strong>Grant</strong>.</li>
        </ol>
        <p class="helper" id="pair-expiry"></p>
        <details class="helper">
          <summary>Can't scan?</summary>
          <p>Open this link on the phone. Treat it like the code: anyone with it can ask for access until it expires.</p>
          <code id="pair-link"></code>
        </details>
      </div>
      <p class="notice" id="pair-status" role="status" aria-live="polite"></p>
      <button id="pair-again" hidden>Show a new code</button>
    </main>
  </body>
</html>
